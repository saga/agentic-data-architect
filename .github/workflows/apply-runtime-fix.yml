name: Apply runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime and refresh recovery
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/agent/copilot.ts')
          s = p.read_text()
          old = """    ...(input.permissionMode === 'allow_all' ? { onPermissionRequest: approveAll } : {}),"""
          new = """    // Permission 模式必须显式返回 no-result，让工作台已有的 permission.requested UI 接管请求。
          // 如果省略 handler，当前 Copilot CLI 会按 deny-by-default 处理，用户根本看不到确认请求。
          ...(input.permissionMode === 'allow_all'
            ? { onPermissionRequest: approveAll }
            : { onPermissionRequest: async () => ({ kind: 'no-result' as const }) }),"""
          if old not in s:
              raise SystemExit('copilot permission anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('web/src/main.tsx')
          s = p.read_text()
          s = s.replace("import React from 'react';", "import React, { useEffect, useRef, useState } from 'react';")
          old = """ReactDOM.createRoot(document.getElementById('root')!).render(\n  <React.StrictMode>\n    <App />\n  </React.StrictMode>,\n);\n"""
          new = r'''function ExecutionRecovery() {
  const [running, setRunning] = useState(false);
  const runningRef = useRef(false);

  useEffect(() => {
    const match = window.location.pathname.match(/^\/investigations\/([^/]+)/);
    const session = match?.[1] ? decodeURIComponent(match[1]) : '';
    if (!session) return;

    const readStatus = async () => {
      try {
        const response = await window.fetch(`/api/sessions/${encodeURIComponent(session)}/trajectory?limit=20`);
        if (!response.ok) return;
        const payload = await response.json() as { summary?: { state?: string } | null };
        const next = payload.summary?.state === 'running' || payload.summary?.state === 'waiting';
        runningRef.current = next;
        setRunning(next);
      } catch {
        // 页面刷新或服务重启瞬间读取失败时，不阻塞正常聊天。
      }
    };

    void readStatus();
    const timer = window.setInterval(() => void readStatus(), 1500);
    return () => window.clearInterval(timer);
  }, []);

  useEffect(() => {
    const originalFetch = window.fetch.bind(window);
    const patchedFetch: typeof window.fetch = async (input, init) => {
      const url = typeof input === 'string' ? input : input instanceof Request ? input.url : String(input);
      if (runningRef.current && /\/api\/sessions\/[^/]+\/messages\/stream(?:$|\?)/.test(url)) {
        while (runningRef.current) {
          await new Promise((resolve) => window.setTimeout(resolve, 1000));
        }
      }
      return originalFetch(input, init);
    };
    window.fetch = patchedFetch;
    return () => { window.fetch = originalFetch; };
  }, []);

  if (!running) return null;
  return (
    <div style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 10000,
      height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#fff7e6', borderBottom: '1px solid #ffd591',
      color: '#874d00', fontSize: 13,
    }}>
      上一轮任务仍在执行，刷新后已恢复运行状态。现在发送的问题会在上一轮完成后自动继续。
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')!).render(
  <React.StrictMode>
    <ExecutionRecovery />
    <App />
  </React.StrictMode>,
);
'''
          if old not in s:
              raise SystemExit('main render anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-runtime-fix.yml
          git add src/agent/copilot.ts web/src/main.tsx .github/workflows/apply-runtime-fix.yml
          git commit -m 'fix: restore execution state after refresh and surface permissions' || exit 0
          git push
