name: Apply avatar fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-avatar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch avatar handling
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('web/src/App.tsx')
          s = app.read_text()

          old = """  const avatarPath = props.avatarPath ?? props.control.agent.avatarPath;\n  const avatarId = avatarPath?.split('/').pop()?.replace(/\\\\.png$/i, '');\n"""
          new = """  const avatarPath = props.avatarPath ?? props.control.agent.avatarPath;\n  // avatarPath 是 workspace 相对路径；这里只取 UUID，不能把 .png 一起传给后端。\n  const avatarId = avatarPath?.split('/').pop()?.replace(/\\.png$/i, '');\n"""
          if old not in s:
              raise SystemExit('AssistantAvatar regex anchor not found')
          s = s.replace(old, new, 1)

          old = """  // 每条回复固定一个随机头像；配置或消息刷新时只为尚未分配的消息抽取一次，避免流式渲染过程中头像跳变。\n  const [assistantAvatarByMessage, setAssistantAvatarByMessage] = useState<Record<string, string>>({});\n  useEffect(() => {\n    const avatarPaths = current?.control.agent.avatarPaths ?? (current?.control.agent.avatarPath ? [current.control.agent.avatarPath] : []);\n    if (!avatarPaths.length) return;\n    const assistantMessages = (current?.messages ?? []).filter((message) => message.role === 'assistant');\n    setAssistantAvatarByMessage((previous) => {\n      const next = { ...previous };\n      for (const message of assistantMessages) {\n        if (!next[message.id]) next[message.id] = avatarPaths[Math.floor(Math.random() * avatarPaths.length)];\n      }\n      return next;\n    });\n  }, [current?.control.agent.avatarPath, current?.control.agent.avatarPaths, current?.messages]);\n"""
          new = """  // 每条回复固定一个随机头像。分配结果同时持久化到浏览器，避免上传新头像或刷新页面后旧消息全部换头像。\n  const [assistantAvatarByMessage, setAssistantAvatarByMessage] = useState<Record<string, string>>({});\n  useEffect(() => {\n    const sessionName = current?.context.name;\n    const avatarPaths = current?.control.agent.avatarPaths ?? (current?.control.agent.avatarPath ? [current.control.agent.avatarPath] : []);\n    if (!sessionName || !avatarPaths.length) return;\n\n    const storageKey = `ada.avatarAssignments.${sessionName}`;\n    let stored: Record<string, string> = {};\n    try {\n      const raw = localStorage.getItem(storageKey);\n      if (raw) {\n        const parsed = JSON.parse(raw) as unknown;\n        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) stored = parsed as Record<string, string>;\n      }\n    } catch {\n      // 本地存储不可用时仍然允许当前页面正常显示头像。\n    }\n\n    const assistantMessages = (current?.messages ?? []).filter((message) => message.role === 'assistant');\n    const next = { ...stored };\n    for (const message of assistantMessages) {\n      if (!next[message.id]) {\n        next[message.id] = avatarPaths[Math.floor(Math.random() * avatarPaths.length)];\n      }\n    }\n\n    setAssistantAvatarByMessage(next);\n    try {\n      localStorage.setItem(storageKey, JSON.stringify(next));\n    } catch {\n      // 不影响聊天。\n    }\n  }, [current?.context.name, current?.control.agent.avatarPath, current?.control.agent.avatarPaths, current?.messages]);\n"""
          if old not in s:
              raise SystemExit('avatar assignment block not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          server = Path('src/server.ts')
          s = server.read_text()
          old = """          avatarPath: relativePath,\n          avatarPaths,\n"""
          new = """          // avatarPaths 是完整头像池；avatarPath 保留原来的默认头像，不能随着每次上传被替换。\n          avatarPath: current.agent.avatarPath ?? relativePath,\n          avatarPaths,\n"""
          if old not in s:
              raise SystemExit('server avatarPath anchor not found')
          server.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-avatar.yml
          git add web/src/App.tsx src/server.ts .github/workflows/fix-avatar.yml
          git commit -m 'fix: preserve multiple assistant avatars across messages' || exit 0
          git push
