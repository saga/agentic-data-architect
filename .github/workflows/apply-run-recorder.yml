name: Apply local run recorder integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-run-recorder.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch copilot runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/agent/copilot.ts'); s=p.read_text()
          s=s.replace("import type { WorkflowId } from '../investigation/schemas.js';", "import type { WorkflowId } from '../investigation/schemas.js';\nimport { createRunRecorder, type RunRecorder } from '../investigation/run-recorder.js';")
          anchor="""  let latestContextMessages: number | undefined;\n"""
          repl=anchor+"""  const runRecorder: RunRecorder | null = input.turnId\n    ? await createRunRecorder(investigationName, {\n        turnId: input.turnId,\n        sessionId: session.sessionId,\n        prompt: input.prompt,\n        systemPrompt: input.systemPrompt,\n        workflowInstruction,\n        model: input.model ?? config.model,\n        workingDirectory,\n        workflowSkill: input.workflowSkill ?? null,\n        permissionMode: input.permissionMode ?? 'permission',\n        mcpServers: Object.keys(mcpServers),\n      })\n    : null;\n"""
          if anchor not in s: raise SystemExit('anchor vars not found')
          s=s.replace(anchor,repl,1)
          anchor="""      content = '';\n      if (execution > 0) {\n"""
          repl="""      content = '';\n      await runRecorder?.write('agent_request', {\n        execution,\n        prompt: continuationPrompt,\n        workflowInstruction: currentWorkflowInstruction,\n      });\n      if (execution > 0) {\n"""
          if anchor not in s: raise SystemExit('execution anchor not found')
          s=s.replace(anchor,repl,1)
          anchor="""      finalContent = final?.data.content || content;\n\n      // 每个阶段结束后立即应用 Workflow outcome。这样自动续跑进入下一阶段时，\n"""
          repl="""      finalContent = final?.data.content || content;\n      await runRecorder?.write('model_response', {\n        execution,\n        response: finalContent,\n        sessionTurnId: final?.data.turnId,\n      });\n\n      // 每个阶段结束后立即应用 Workflow outcome。这样自动续跑进入下一阶段时，\n"""
          if anchor not in s: raise SystemExit('response anchor not found')
          s=s.replace(anchor,repl,1)
          # Add raw event recording alongside the existing operational trajectory hooks.
          anchor="""    input.onTrajectory?.({\n      type: 'tool_call',\n      name: `调用工具 #${toolCallCount}: ${toolName || '工具调用'}`,\n"""
          repl="""    void runRecorder?.write('tool_call', {\n      toolCallId,\n      toolName,\n      mcpServerName: e.data.mcpServerName,\n      mcpToolName: e.data.mcpToolName,\n      parentToolCallId: e.data.parentToolCallId,\n      arguments: e.data.arguments,\n    });\n    input.onTrajectory?.({\n      type: 'tool_call',\n      name: `调用工具 #${toolCallCount}: ${toolName || '工具调用'}`,\n"""
          if anchor not in s: raise SystemExit('tool start anchor not found')
          s=s.replace(anchor,repl,1)
          anchor="""    if (toolCallId) trajectoryToolStarts.delete(toolCallId);\n  });\n"""
          repl="""    void runRecorder?.write('tool_result', {\n      toolCallId,\n      toolName,\n      success: e.data.success,\n      result: e.data.result,\n      error: e.data.error,\n      toolTelemetry: e.data.toolTelemetry,\n    });\n    if (toolCallId) trajectoryToolStarts.delete(toolCallId);\n  });\n"""
          if anchor not in s: raise SystemExit('tool result anchor not found')
          s=s.replace(anchor,repl,1)
          # Capture permission and user-input lifecycle including actual decisions/answers when the SDK emits them.
          anchor="""    const managedApprovalRequired = request.managedApprovalRequired === true;\n"""
          repl="""    void runRecorder?.write('permission_request', { requestId, permissionRequest: request });\n    const managedApprovalRequired = request.managedApprovalRequired === true;\n"""
          if anchor not in s: raise SystemExit('permission anchor not found')
          s=s.replace(anchor,repl,1)
          anchor="""    input.onTrajectory?.({\n      type: 'user_input_requested',\n"""
          repl="""    void runRecorder?.write('user_input_request', {\n      requestId: e.data.requestId,\n      question: e.data.question,\n      choices: e.data.choices,\n      allowFreeform: e.data.allowFreeform,\n    });\n    input.onTrajectory?.({\n      type: 'user_input_requested',\n"""
          if anchor not in s: raise SystemExit('user input request anchor not found')
          s=s.replace(anchor,repl,1)
          anchor="""  const offUserInputCompleted = session.on('user_input.completed', (e) => {\n"""
          repl=anchor
          # Put completion recorder immediately after handler opens, before map lookup.
          s=s.replace(anchor,anchor+"""    void runRecorder?.write('user_input_completed', e.data);\n""",1)
          # Record important runtime errors and usage as well.
          anchor="""  const offSessionError = session.on('session.error', (e) => {\n"""
          s=s.replace(anchor,anchor+"""    void runRecorder?.write('session_error', e.data);\n""",1)
          anchor="""  const offUsage = session.on('assistant.usage', (e) => {\n"""
          s=s.replace(anchor,anchor+"""    void runRecorder?.write('model_usage', e.data);\n""",1)
          # Ensure the recorder is closed after the final turn record.
          anchor="""    input.onTrajectory?.({\n      type: 'turn_end',\n      name: 'Agent 本轮结束',\n"""
          # Insert close after the full turn_end callback is hard to locate safely; close in final cleanup below instead.
          # Existing finally block is the reliable lifecycle boundary.
          p.write_text(s)
          PY
      - name: Add recorder cleanup and commit
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/agent/copilot.ts'); s=p.read_text()
          # Close recorder in the existing finally block only once.
          marker="""  } finally {\n    clearInterval(heartbeat);\n"""
          if marker not in s: raise SystemExit('finally marker not found')
          s=s.replace(marker,"""  } finally {\n    await runRecorder?.write('run_finished', { elapsedMs: Date.now() - turnStartedAt });\n    await runRecorder?.close();\n    clearInterval(heartbeat);\n""",1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent/copilot.ts
          git commit -m 'feat: record complete local investigation runs' || true
          git push
          rm -f .github/workflows/apply-run-recorder.yml
          git add .github/workflows/apply-run-recorder.yml
          git commit -m 'chore: remove temporary recorder patch workflow' || true
          git push
