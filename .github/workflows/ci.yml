name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm install

      - name: Audit critical Node production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python production dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Audit high production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          PYTHON_TOOLCHAIN: python3

      - name: Build
        run: npm run build
