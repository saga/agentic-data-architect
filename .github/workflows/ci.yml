name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sqlglot
      - run: npm install
      - name: upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1
      - name: block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
      - name: report high production dependency vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
        env:
          SQLGLOT_PYTHON: python3
