name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Sync Python environment
        run: uv sync

      - name: Install Node dependencies
        run: npm install

      - name: Audit critical Node production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit Python production dependencies
        run: |
          uv export --no-dev --format requirements.txt --output-file /tmp/requirements-prod.txt
          uv run --group dev pip-audit -r /tmp/requirements-prod.txt --strict

      - name: Audit high production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
